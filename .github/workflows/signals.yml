name: meme-signals

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install gmgn-cli
        run: npm install -g gmgn-cli

      - name: Configure GMGN key
        run: |
          mkdir -p ~/.config/gmgn
          printf 'GMGN_API_KEY=%s\n' "${{ secrets.GMGN_API_KEY }}" > ~/.config/gmgn/.env
          gmgn-cli config --check

      - name: Run scan
        run: bash scan.sh
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Commit signals
        run: |
          git config user.name "signals-bot"
          git config user.email "signals-bot@localhost"
          git add signals/
          git diff --cached --quiet || { git commit -m "signals $(date -u +%FT%TZ)"; git push; }
